<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Analyst AI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0a0f;
        color: #e2e2e8;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: #111118;
        border-bottom: 1px solid #1e1e2e;
        flex-shrink: 0;
      }

      .logo {
        width: 36px;
        height: 36px;
        background: #7c3aed;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo svg {
        width: 18px;
        height: 18px;
        color: white;
        stroke: white;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .header-info h1 {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
      }

      .header-info p {
        font-size: 11px;
        color: #6b7280;
        margin-top: 1px;
      }

      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #6b7280;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* Messages area */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
      }

      #messages::-webkit-scrollbar {
        width: 4px;
      }
      #messages::-webkit-scrollbar-track {
        background: transparent;
      }
      #messages::-webkit-scrollbar-thumb {
        background: #2a2a3a;
        border-radius: 4px;
      }

      /* Empty state */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        text-align: center;
        gap: 16px;
        padding: 40px 20px;
      }

      .empty-icon {
        width: 64px;
        height: 64px;
        background: rgba(124, 58, 237, 0.15);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .empty-icon svg {
        width: 32px;
        height: 32px;
        stroke: #a78bfa;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .empty-state h2 {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
      }

      .empty-state p {
        font-size: 13px;
        color: #6b7280;
        max-width: 340px;
        line-height: 1.6;
      }

      .suggestions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
        max-width: 560px;
        margin-top: 8px;
      }

      .suggestion-btn {
        background: #111118;
        border: 1px solid #1e1e2e;
        color: #c4c4d4;
        font-size: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s, border-color 0.15s;
        line-height: 1.4;
      }

      .suggestion-btn:hover {
        background: #1a1a28;
        border-color: #7c3aed;
        color: #e2e2e8;
      }

      /* Message row */
      .message-row {
        display: flex;
        gap: 10px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .message-row.user {
        flex-direction: row-reverse;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 2px;
      }

      .avatar.assistant {
        background: #7c3aed;
      }

      .avatar.user {
        background: #1e1e2e;
      }

      .avatar svg {
        width: 15px;
        height: 15px;
        stroke: #ccc;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .avatar.assistant svg {
        stroke: white;
      }

      .bubble {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble.assistant {
        background: #111118;
        border: 1px solid #1e1e2e;
        border-top-left-radius: 4px;
        color: #e2e2e8;
      }

      .bubble.user {
        background: #7c3aed;
        border-top-right-radius: 4px;
        color: #fff;
      }

      /* Typing indicator */
      .typing {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 14px 16px;
      }

      .typing span {
        width: 7px;
        height: 7px;
        background: #6b7280;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-6px); }
      }

      /* Error */
      .error-msg {
        text-align: center;
        font-size: 12px;
        color: #f87171;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        padding: 8px 16px;
        max-width: 400px;
        margin: 0 auto;
      }

      /* Input area */
      footer {
        padding: 12px 16px 16px;
        background: #111118;
        border-top: 1px solid #1e1e2e;
        flex-shrink: 0;
      }

      .input-row {
        display: flex;
        gap: 8px;
        max-width: 800px;
        margin: 0 auto;
      }

      #user-input {
        flex: 1;
        background: #0a0a0f;
        border: 1px solid #1e1e2e;
        color: #e2e2e8;
        font-size: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.15s;
        font-family: inherit;
        resize: none;
        height: 48px;
        line-height: 1.4;
      }

      #user-input::placeholder {
        color: #4b5563;
      }

      #user-input:focus {
        border-color: #7c3aed;
      }

      #send-btn {
        width: 48px;
        height: 48px;
        background: #7c3aed;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.15s, opacity 0.15s;
      }

      #send-btn:hover {
        background: #6d28d9;
      }

      #send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #send-btn svg {
        width: 16px;
        height: 16px;
        stroke: white;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .hint {
        text-align: center;
        font-size: 11px;
        color: #374151;
        margin-top: 8px;
      }

      @media (max-width: 600px) {
        .suggestions {
          grid-template-columns: 1fr;
        }
        .bubble {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/>
          <path d="M15 7v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2z"/>
        </svg>
      </div>
      <div class="header-info">
        <h1>Business Analyst AI</h1>
        <p>Powered by Groq · qwen3.8-27b</p>
      </div>
      <div class="status">
        <div class="status-dot"></div>
        Online
      </div>
    </header>

    <!-- Messages -->
    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24">
            <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/>
            <path d="M15 7v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2z"/>
          </svg>
        </div>
        <h2>Your BA Assistant is ready</h2>
        <p>Ask me to write user stories, map processes, analyze requirements, or evaluate project feasibility.</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="fillInput(this)">Write user stories for a login & registration feature</button>
          <button class="suggestion-btn" onclick="fillInput(this)">Map the current invoice approval process and find bottlenecks</button>
          <button class="suggestion-btn" onclick="fillInput(this)">Help me create acceptance criteria for a payment gateway</button>
          <button class="suggestion-btn" onclick="fillInput(this)">What KPIs should I track for a customer support system?</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <footer>
      <div class="input-row">
        <textarea
          id="user-input"
          placeholder="Ask about user stories, process mapping, requirements..."
          rows="1"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24">
            <path d="m22 2-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <p class="hint">Press Enter to send · Shift+Enter for new line</p>
    </footer>

    <script>
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const emptyState = document.getElementById("empty-state");

      // Chat history sent to the server
      const history = [];

      function fillInput(btn) {
        inputEl.value = btn.textContent;
        inputEl.focus();
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function appendMessage(role, content) {
        if (emptyState) emptyState.remove();

        const row = document.createElement("div");
        row.className = `message-row ${role}`;

        const avatar = document.createElement("div");
        avatar.className = `avatar ${role}`;
        avatar.innerHTML = role === "assistant"
          ? `<svg viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/><path d="M15 7v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2z"/></svg>`
          : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = content;

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();

        return bubble;
      }

      function showTyping() {
        const row = document.createElement("div");
        row.className = "message-row assistant";
        row.id = "typing-row";

        const avatar = document.createElement("div");
        avatar.className = "avatar assistant";
        avatar.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/><path d="M15 7v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2z"/></svg>`;

        const bubble = document.createElement("div");
        bubble.className = "bubble assistant typing";
        bubble.innerHTML = "<span></span><span></span><span></span>";

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
      }

      function removeTyping() {
        document.getElementById("typing-row")?.remove();
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || sendBtn.disabled) return;

        inputEl.value = "";
        sendBtn.disabled = true;

        // Add to history and UI
        history.push({ role: "user", content: text });
        appendMessage("user", text);
        showTyping();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });

          removeTyping();
          const bubble = appendMessage("assistant", "");
          let fullText = "";

          const reader = res.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const lines = decoder.decode(value).split("\n");
            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const data = line.slice(6);
              if (data === "[DONE]") break;

              try {
                const parsed = JSON.parse(data);
                if (parsed.text) {
                  fullText += parsed.text;
                  bubble.textContent = fullText;
                  scrollToBottom();
                }
                if (parsed.error) {
                  bubble.textContent = "Error: " + parsed.error;
                }
              } catch {}
            }
          }

          history.push({ role: "assistant", content: fullText });
        } catch (err) {
          removeTyping();
          const errEl = document.createElement("div");
          errEl.className = "error-msg";
          errEl.textContent = "Connection error. Is the server running?";
          messagesEl.appendChild(errEl);
          scrollToBottom();
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      // Enter to send, Shift+Enter for newline
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
